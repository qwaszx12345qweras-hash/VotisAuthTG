# ==========================================
#  Конфигурация мода TelegramAuth
# ==========================================

# --- Настройки Telegram-бота ---
telegram:
  # Токен вашего бота, полученный от @BotFather
  # Можно использовать переменные окружения: ${TELEGRAM_BOT_TOKEN}
  bot-token: "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
  
  # Юзернейм бота (без @), например: votisworld_bot
  bot-username: "votisworld_bot"
  
  # ID чата или канала, куда бот будет отправлять уведомления о входах
  # Если не нужно, оставьте пустым
  admin-chat-id: ""

  # Язык сообщений бота: ru, en
  language: "ru"

# --- Настройки блокировки игрока ---
freeze:
  # Блокировать ли движение игрока (телепортировать обратно на точку входа)
  block-movement: true
  
  # Точка, куда будет телепортироваться игрок при попытке сдвинуться
  # Если не указана, используется точка входа игрока
  spawn-point:
    world: "world"
    x: 0.0
    y: 64.0
    z: 0.0
  
  # Блокировать ли все команды (кроме /link)
  block-commands: true
  
  # Список команд, которые РАЗРЕШЕНЫ во время блокировки
  allowed-commands:
    - "link"
    - "help"
  
  # Блокировать ли взаимодействие с блоками (ломание, установка, открытие сундуков)
  block-interaction: true
  
  # Блокировать ли использование предметов (еда, зелья, луки)
  block-item-use: true
  
  # Блокировать ли чат (игрок не может писать в общий чат)
  block-chat: true

# --- Настройки привязки ---
linking:
  # Длина кода для привязки (рекомендуется 6)
  code-length: 6
  
  # Время жизни кода в секундах (по истечении код становится недействительным)
  code-lifetime-seconds: 300
  
  # Сообщение, которое видит игрок при вводе /link
  link-message: |
    &eДля привязки аккаунта перейдите в бота: &bhttps://t.me/{bot_username}
    &eИ отправьте команду: &a/link {code}
    &7Код действителен в течение {lifetime} секунд.

# --- Сообщения игроку ---
messages:
  # Сообщение при входе, если аккаунт не привязан
  not-linked: |
    &c&lВНИМАНИЕ!
    &cВаш аккаунт не привязан к Telegram.
    &eВведите &a/link &eчтобы получить код для привязки.
  
  # Сообщение при входе, если аккаунт привязан, но нужно подтверждение
  need-confirm: |
    &eПожалуйста, подтвердите вход в Telegram.
    &7Откройте бота и нажмите кнопку "Подтвердить".
  
  # Сообщение после успешного подтверждения
  confirmed: "&aВход успешно подтвержден! Добро пожаловать."
  
  # Сообщение при вводе команды во время блокировки
  command-blocked: "&cВы не можете использовать команды, пока не подтвердите вход!"
  
  # Сообщение при попытке движения во время блокировки
  movement-blocked: "&cВы не можете двигаться, пока не подтвердите вход!"
  
  # Сообщение при попытке сломать/поставить блок
  interaction-blocked: "&cВы не можете взаимодействовать с миром, пока не подтвердите вход!"
